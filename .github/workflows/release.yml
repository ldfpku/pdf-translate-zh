name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions match tag
        # 单一数据源是 SKILL.md frontmatter 的 metadata.version；
        # 脚本校验正文展示行、plugin.json、marketplace.json 三处是否都与它一致，
        # 再校验 frontmatter 是否等于本次标签。任一不一致则发布失败。
        run: python tools/sync_version.py --check --tag "$GITHUB_REF_NAME"
      - name: Package
        run: python tools/package.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/pdf-translate-zh.zip --title "$GITHUB_REF_NAME" --generate-notes
