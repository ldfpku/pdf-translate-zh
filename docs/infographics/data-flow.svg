<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="数据去向：排版在本机完成不上传；翻译由 AI 工具所连的大模型完成，云端模型会把内容发给服务商，本地模型不出本机或内网">
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Hiragino Sans GB",sans-serif}
.panel{fill:#fff;stroke:#d1d9e0}
.card{fill:#f6f8fa;stroke:#d1d9e0}
.t{fill:#1f2328}.m{fill:#59636e}
.acc{fill:#0969da}.accbg{fill:#ddf4ff;stroke:#54aeff}
.fix{fill:#1a7f37}.fixbg{fill:#dafbe1;stroke:#4ac26b}
.warn{fill:#9a6700}.warnbg{fill:#fff8c5;stroke:#d4a72c}
.ln{stroke:#8c959f;fill:none}.ah{fill:#8c959f}
@media (prefers-color-scheme:dark){
.panel{fill:#0d1117;stroke:#3d444d}
.card{fill:#151b23;stroke:#3d444d}
.t{fill:#e6edf3}.m{fill:#9198a1}
.acc{fill:#4493f8}.accbg{fill:#0c2d6b;stroke:#1f6feb}
.fix{fill:#3fb950}.fixbg{fill:#0f2d1a;stroke:#238636}
.warn{fill:#d29922}.warnbg{fill:#2e2206;stroke:#9e6a03}
.ln{stroke:#656c76}.ah{fill:#656c76}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="299" rx="12"/>

<rect class="card" x="24" y="28" width="140" height="80" rx="10"/>
<text class="t" x="94" y="64" text-anchor="middle" font-size="16" font-weight="700">英文 PDF</text>
<text class="m" x="94" y="88" text-anchor="middle" font-size="12">你的原文件</text>

<line class="ln" x1="168" y1="68" x2="234" y2="68" stroke-width="2" marker-end="url(#a)"/>

<rect class="accbg" x="240" y="28" width="400" height="80" rx="10"/>
<text class="acc" x="440" y="56" text-anchor="middle" font-size="16" font-weight="700">本机排版引擎</text>
<text class="t" x="440" y="79" text-anchor="middle" font-size="13">提取 · 排版 · 检查 · 出稿</text>
<text class="m" x="440" y="98" text-anchor="middle" font-size="12">全程在你的电脑上运行，不上传文档</text>

<line class="ln" x1="642" y1="68" x2="710" y2="68" stroke-width="2" marker-end="url(#a)"/>

<rect class="card" x="716" y="28" width="140" height="80" rx="10"/>
<text class="t" x="786" y="64" text-anchor="middle" font-size="16" font-weight="700">中文 PDF</text>
<text class="m" x="786" y="88" text-anchor="middle" font-size="12">译稿 + 附录</text>

<line class="ln" x1="410" y1="110" x2="410" y2="156" stroke-width="2" marker-end="url(#a)"/>
<line class="ln" x1="470" y1="156" x2="470" y2="112" stroke-width="2" marker-end="url(#a)"/>
<text class="m" x="400" y="138" text-anchor="end" font-size="12">待译文字</text>
<text class="m" x="480" y="138" font-size="12">译文</text>

<rect class="card" x="240" y="160" width="400" height="120" rx="10"/>
<text class="t" x="440" y="185" text-anchor="middle" font-size="14" font-weight="700">翻译：由你的 AI 工具所连的大模型完成</text>

<rect class="warnbg" x="256" y="198" width="176" height="70" rx="8"/>
<text class="warn" x="344" y="220" text-anchor="middle" font-size="15" font-weight="700">云端模型</text>
<text class="t" x="344" y="241" text-anchor="middle" font-size="12">原文与译稿发给服务商</text>
<text class="m" x="344" y="259" text-anchor="middle" font-size="11">Claude · GPT · Gemini 等</text>

<rect class="fixbg" x="448" y="198" width="176" height="70" rx="8"/>
<text class="fix" x="536" y="220" text-anchor="middle" font-size="15" font-weight="700">本地模型</text>
<text class="t" x="536" y="241" text-anchor="middle" font-size="12">原文与译稿不出本机或内网</text>
<text class="fix" x="536" y="259" text-anchor="middle" font-size="11" font-weight="700">敏感文档推荐</text>
</svg>
