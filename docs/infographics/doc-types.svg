<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="不同文档不同处理：说明书与规范重新排版；图纸与表单原位换字；图文混排逐页分流；PPT 讲义保留版式">
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Hiragino Sans GB",sans-serif}
.panel{fill:#fff;stroke:#d1d9e0}
.card{fill:#f6f8fa;stroke:#d1d9e0}
.t{fill:#1f2328}.m{fill:#59636e}
.acc{fill:#0969da}.accbg{fill:#ddf4ff;stroke:#54aeff}
.ic{fill:#fff;stroke:#59636e}.icl{stroke:#8c959f;fill:none}.icf{fill:#8c959f}
.ln{stroke:#8c959f;fill:none}.ah{fill:#8c959f}
@media (prefers-color-scheme:dark){
.panel{fill:#0d1117;stroke:#3d444d}
.card{fill:#151b23;stroke:#3d444d}
.t{fill:#e6edf3}.m{fill:#9198a1}
.acc{fill:#4493f8}.accbg{fill:#0c2d6b;stroke:#1f6feb}
.ic{fill:#0d1117;stroke:#9198a1}.icl{stroke:#656c76}.icf{fill:#656c76}
.ln{stroke:#656c76}.ah{fill:#656c76}
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<g id="c">
<rect class="card" width="201" height="210" rx="10"/>
<line class="ln" x1="100.5" y1="148" x2="100.5" y2="162" stroke-width="2" marker-end="url(#a)"/>
<rect class="accbg" x="12" y="166" width="177" height="34" rx="8"/>
</g>
</defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="249" rx="12"/>

<!-- 1 说明书、规范 -->
<g transform="translate(20 20)"><use href="#c"/>
<rect class="ic" x="78" y="18" width="45" height="58" rx="3" stroke-width="1.5"/>
<g class="icl" stroke-width="2"><line x1="86" y1="30" x2="110" y2="30"/><line x1="86" y1="39" x2="115" y2="39"/><line x1="86" y1="48" x2="115" y2="48"/><line x1="86" y1="57" x2="115" y2="57"/><line x1="86" y1="66" x2="104" y2="66"/></g>
<text class="t" x="100.5" y="104" text-anchor="middle" font-size="16" font-weight="700">说明书、规范</text>
<text class="m" x="100.5" y="128" text-anchor="middle" font-size="12">操作手册、维修规程</text>
<text class="acc" x="100.5" y="188" text-anchor="middle" font-size="15" font-weight="700">重新排版</text></g>

<!-- 2 图纸、表单 -->
<g transform="translate(233 20)"><use href="#c"/>
<rect class="ic" x="72" y="18" width="58" height="58" rx="3" stroke-width="1.5"/>
<g class="icl" stroke-width="1.5"><circle cx="94" cy="40" r="12"/><circle cx="94" cy="40" r="5"/><line x1="76" y1="40" x2="112" y2="40" stroke-dasharray="3 2"/><line x1="94" y1="22" x2="94" y2="58" stroke-dasharray="3 2"/><rect x="108" y="60" width="18" height="12"/><line x1="108" y1="66" x2="126" y2="66"/></g>
<text class="t" x="100.5" y="104" text-anchor="middle" font-size="16" font-weight="700">图纸、表单</text>
<text class="m" x="100.5" y="128" text-anchor="middle" font-size="12">装配图、检验记录表</text>
<text class="acc" x="100.5" y="188" text-anchor="middle" font-size="15" font-weight="700">原位换字，线条不动</text></g>

<!-- 3 图文混排 -->
<g transform="translate(446 20)"><use href="#c"/>
<rect class="ic" x="66" y="18" width="40" height="52" rx="3" stroke-width="1.5"/>
<g class="icl" stroke-width="2"><line x1="73" y1="29" x2="99" y2="29"/><line x1="73" y1="38" x2="99" y2="38"/><line x1="73" y1="47" x2="99" y2="47"/><line x1="73" y1="56" x2="90" y2="56"/></g>
<rect class="ic" x="95" y="26" width="40" height="52" rx="3" stroke-width="1.5"/>
<g class="icl" stroke-width="1.5"><circle cx="112" cy="46" r="9"/><line x1="100" y1="46" x2="124" y2="46" stroke-dasharray="3 2"/><rect x="118" y="64" width="13" height="9"/></g>
<text class="t" x="100.5" y="104" text-anchor="middle" font-size="16" font-weight="700">图文混排</text>
<text class="m" x="100.5" y="128" text-anchor="middle" font-size="12">正文里夹着图纸页</text>
<text class="acc" x="100.5" y="188" text-anchor="middle" font-size="15" font-weight="700">逐页分流，原序合订</text></g>

<!-- 4 PPT 讲义 -->
<g transform="translate(659 20)"><use href="#c"/>
<rect class="ic" x="64" y="24" width="73" height="46" rx="3" stroke-width="1.5"/>
<rect class="icf" x="71" y="31" width="40" height="5" rx="1"/>
<g class="icf"><circle cx="74" cy="46" r="2"/><circle cx="74" cy="55" r="2"/><circle cx="74" cy="64" r="2"/></g>
<g class="icl" stroke-width="2"><line x1="80" y1="46" x2="104" y2="46"/><line x1="80" y1="55" x2="100" y2="55"/><line x1="80" y1="64" x2="102" y2="64"/></g>
<rect class="icl" x="110" y="44" width="21" height="21" stroke-width="1.5"/>
<text class="t" x="100.5" y="104" text-anchor="middle" font-size="16" font-weight="700">PPT 讲义</text>
<text class="m" x="100.5" y="128" text-anchor="middle" font-size="12">幻灯片导出的横版 PDF</text>
<text class="acc" x="100.5" y="188" text-anchor="middle" font-size="15" font-weight="700">保留版式，列表重排</text></g>
</svg>
